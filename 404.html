<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<style>
  /* Inline on purpose: this page is served at any missing path, so relative links would break. */
  :root { color-scheme: light dark; --bg: #E9EEE6; --surface: #fff; --ink: #1D2328; --text: #1D2328; --muted: #46504A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161B1F; --surface: #232A30; --ink: #050708; --text: #EEF2EC; --muted: #AEB8B1; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 700 17px/1.5 ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--surface); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 4px 0 var(--ink);
    padding: 28px 24px; max-width: 360px; text-align: center; }
  .face { width: 84px; height: 84px; margin: 0 auto 12px; border-radius: 50%; background: #FFC93C; border: 3px solid var(--ink);
    position: relative; }
  .face::before, .face::after { content: ''; position: absolute; top: 28px; width: 11px; height: 16px; border-radius: 50%; background: #1D2328; }
  .face::before { left: 24px; } .face::after { right: 24px; }
  .face i { position: absolute; left: 30px; right: 30px; bottom: 20px; height: 4px; border-radius: 2px; background: #1D2328; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  a { display: inline-block; padding: 12px 20px; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
    background: #FF7A2F; color: #1D2328; font-weight: 900; text-decoration: none; }
  a:active { transform: translateY(4px); box-shadow: none; }
</style>
</head>
<body>
<main class="card">
  <div class="face" aria-hidden="true"><i></i></div>
  <h1>Page not found</h1>
  <p>This monster looked everywhere, but this page isn't here.</p>
  <a href="https://mfoesters.github.io/tube-monsters-website/">Go home</a>
</main>
</body>
</html>
